services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db2:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME2}
      POSTGRES_USER: ${DB_USER2}
      POSTGRES_PASSWORD: ${DB_PASSWORD2}

    volumes:
      - pg_data2:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER2} -d ${DB_NAME2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_food:
    image: postgres:16
    environment:
      POSTGRES_DB: ${FOOD_DB_NAME:-food_tracker}
      POSTGRES_USER: ${FOOD_DB_USER:-food_user}
      POSTGRES_PASSWORD: ${FOOD_DB_PASSWORD:-food_password}
    volumes:
      - pg_data_food:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FOOD_DB_USER:-food_user} -d ${FOOD_DB_NAME:-food_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./HT3

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure--CHANGE-ME-IN-PRODUCTION--replace-with-secure-key!!}
      DEBUG: "1"

    volumes:
      - static_volume:/app/staticfiles
      - ./HT3:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  web2:
    build: ./django-get-blank
    restart: unless-stopped
    env_file: django-get-blank/.env
    depends_on:
      db2:
        condition: service_healthy
    volumes:
      - static_volume2:/app/staticfiles
      - media_volume2:/app/media
      - ./django-get-blank:/app
    ports:
      - "8001:8000"

  food-tracker:
    build:
      context: ./food-tracker
      dockerfile: ./backend/Dockerfile
    environment:
      FOOD_DB_NAME: ${DB_NAME}
      FOOD_DB_USER: ${DB_USER}
      FOOD_DB_PASSWORD: ${DB_PASSWORD}
      FOOD_DB_HOST: db
      FOOD_DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure--CHANGE-ME-IN-PRODUCTION--replace-with-secure-key!!}
      DEBUG: "1"
      ALLOWED_HOSTS: "habits-app.ru,www.habits-app.ru,habits-app.ru.local,localhost,127.0.0.1,food-tracker"
      CSRF_TRUSTED_ORIGINS: "http://habits-app.ru.local,http://localhost:8002,http://localhost:5173,https://habits-app.ru"
      CORS_ALLOWED_ORIGINS: "http://habits-app.ru.local,http://localhost:5173,http://localhost:8002,https://habits-app.ru"
    volumes:
      - food_static:/app/staticfiles
      - food_tracker_dist:/usr/share/nginx/food-tracker
      - ./food-tracker/backend:/app
      - /app/frontend_dist
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  food-tracker-frontend:
    build: ./food-tracker/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./food-tracker/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8002"

  nginx:
    image: nginx:latest

    ports:
      - "8080:80"

    volumes:
      -  static_volume:/app/staticfiles
      -  static_volume2:/app2/staticfiles
      -  media_volume2:/app2/media
      -  food_static:/app3/staticfiles
      -  food_tracker_dist:/usr/share/nginx/food-tracker:ro
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - web
      - web2
      - food-tracker

volumes:
  pg_data:
  pg_data2:
  pg_data_food:
  static_volume:
  static_volume2:
  media_volume2:
  food_static:
  food_tracker_dist:
